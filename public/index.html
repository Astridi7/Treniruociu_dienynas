<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treniruočių dienynas</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">MANO PROGRESAS</span><h1>Treniruočių dienynas</h1><p>Kiekviena treniruotė – žingsnis pirmyn.</p></header>
    <section class="card weekly-report" aria-labelledby="weekly-heading">
      <h2 id="weekly-heading">Savaitės suvestinė</h2>
      <div class="week-controls">
        <button type="button" id="previous-week" aria-label="Ankstesnė savaitė">←</button>
        <label>Pasirinkite savaitės dieną<input type="date" id="week-date" required></label>
        <button type="button" id="next-week" aria-label="Kita savaitė">→</button>
        <button type="button" id="current-week">Ši savaitė</button>
      </div>
      <p class="meta">Pirmadienis–sekmadienis. Įtraukiami visi treniruočių tipai.</p>
      <div id="weekly-content" role="status" aria-live="polite"><p>Kraunama…</p></div>
    </section>
    <div class="layout">
      <section class="card"><h2>Pridėti treniruotę</h2>
        <form id="workout-form">
          <label>Pavadinimas<input name="title" required maxlength="100" placeholder="Pvz., jėgos treniruotė"></label>
          <label>Tipas<select name="type"><option>Bėgimas</option><option>Jėga</option><option>Joga</option><option>Plaukimas</option><option selected>Kita</option></select></label>
          <div class="fields"><label>Data<input name="date" type="date" required></label><label>Trukmė (min.)<input name="minutes" type="number" min="1" max="1440" step="1" required placeholder="45"></label></div>
          <label>Pastabos<textarea name="notes" rows="4" maxlength="2000" placeholder="Pratimai, pakartojimai, savijauta…"></textarea></label>
          <button type="submit">+ Pridėti treniruotę</button>
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section class="history"><div class="history-heading"><h2>Mano treniruotės</h2><span id="count" role="status">0 treniruočių</span></div>
        <label>Filtruoti pagal tipą<select id="type-filter"><option value="">Visi</option><option>Bėgimas</option><option>Jėga</option><option>Joga</option><option>Plaukimas</option><option>Kita</option></select></label>
        <div id="workouts"><p>Kraunama…</p></div>
      </section>
    </div>
  </main>
</body>
</html>
